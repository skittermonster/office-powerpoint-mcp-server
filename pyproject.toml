[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-powerpoint-mcp-server"
version = "0.1.0"
description = "Production-ready Office PowerPoint MCP Server built with FastMCP v4, python-pptx, and OpenXML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "python-pptx>=1.0.2",
    "lxml>=5.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.10.0",
]

[project.scripts]
ppt-mcp-server = "powerpoint_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/powerpoint_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
